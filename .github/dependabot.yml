# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    # Unmerged update PRs hold the default open-PR limit of 5, so past it the
    # lowest-ranked updates are silently never proposed (seen on sibling repos).
    # Grouping makes the limit unreachable; the raised limit is belt and braces.
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
