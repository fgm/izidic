name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Latest stable toolchain: Staticcheck needs a current Go to build,
        # and go.mod still sets the floor callers see.
        go-version: stable

    - name: Formatting
      run: "gofmt -d -s ."

    - name: Vet
      run: "go vet ./..."

    - name: StaticCheck
      uses: dominikh/staticcheck-action@v1.4.1
      with:
        version: "2026.2.2"
        install-go: false

    - name: Test
      # We don't need the benchmarks to run for long, just enough for coverage.
      run: mkdir -p coverage; go test -v -race -run=. -bench=. -benchtime=1ms -coverprofile=./coverage/cover.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/cover.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        verbose: true
        directory: ./coverage
        env_vars: OS
